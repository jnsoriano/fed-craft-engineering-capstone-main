<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EventCraft - Error Processing Booking</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Inter:wght@400&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-white": "#FFFFFF",
                        "primary-fixed": "#dae2fd",
                        "surface-bright": "#f8f9ff",
                        "primary-container": "#131b2e",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#002113",
                        "surface": "#f8f9ff",
                        "primary-fixed-dim": "#bec6e0",
                        "error": "#ba1a1a",
                        "surface-variant": "#d3e4fe",
                        "surface-container-high": "#dce9ff",
                        "tertiary-fixed-dim": "#adc6ff",
                        "on-primary-container": "#7c839b",
                        "on-tertiary-fixed": "#001a42",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#cbdbf5",
                        "on-primary-fixed-variant": "#3f465c",
                        "on-tertiary-fixed-variant": "#004395",
                        "surface-container": "#e5eeff",
                        "outline": "#76777d",
                        "error-container": "#ffdad6",
                        "secondary-container": "#6cf8bb",
                        "primary": "#000000",
                        "inverse-surface": "#213145",
                        "budget-danger": "#EF4444",
                        "inverse-primary": "#bec6e0",
                        "background": "#f8f9ff",
                        "budget-warning": "#F59E0B",
                        "on-surface-variant": "#45464d",
                        "surface-tint": "#565e74",
                        "outline-variant": "#c6c6cd",
                        "tertiary-fixed": "#d8e2ff",
                        "on-primary-fixed": "#131b2e",
                        "background-subtle": "#F8FAFC",
                        "secondary": "#006c49",
                        "on-surface": "#0b1c30",
                        "on-tertiary-container": "#3980f4",
                        "on-secondary-container": "#00714d",
                        "surface-container-highest": "#d3e4fe",
                        "surface-container-low": "#eff4ff",
                        "secondary-fixed-dim": "#4edea3",
                        "inverse-on-surface": "#eaf1ff",
                        "tertiary": "#000000",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#0b1c30",
                        "on-secondary-fixed-variant": "#005236",
                        "on-error": "#ffffff",
                        "secondary-fixed": "#6ffbbe",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#001a42"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "xs": "8px",
                        "gutter": "24px",
                        "md": "24px",
                        "xl": "64px",
                        "base": "4px",
                        "sm": "16px",
                        "lg": "40px",
                        "container-max": "1200px"
                    },
                    "fontFamily": {
                        "display-lg": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-md": ["Inter"],
                        "headline-md": ["Hanken Grotesk"],
                        "label-sm": ["JetBrains Mono"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC; /* background-subtle */
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Hanken Grotesk', sans-serif;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-margin-mobile md:p-gutter">
<!-- Nav shell suppressed as this is a transactional error screen -->
<main class="w-full max-w-md bg-surface-white rounded-xl shadow-lg border border-outline-variant p-lg flex flex-col items-center text-center space-y-md animate-fade-in-up">
<!-- Error Icon Container -->
<div class="w-20 h-20 rounded-full bg-error-container flex items-center justify-center mb-sm">
<span class="material-symbols-outlined text-4xl text-error" data-icon="error" style="font-variation-settings: 'FILL' 1;">
                error
            </span>
</div>
<!-- Heading -->
<h1 class="font-headline-lg text-headline-lg text-on-surface">Oops! Something went wrong</h1>
<!-- Message -->
<p class="font-body-md text-body-md text-on-surface-variant max-w-[80%] mx-auto">
            We couldn't process your booking at this time. Please check your details and try again.
        </p>
<!-- Actions -->
<div class="flex flex-col w-full gap-sm mt-lg">
<button class="w-full bg-primary hover:bg-inverse-surface text-on-primary font-body-md text-body-md py-sm px-gutter rounded-DEFAULT transition-colors duration-200">
                Try Again
            </button>
<button class="w-full bg-surface-white border border-outline hover:bg-surface-container-low text-primary font-body-md text-body-md py-sm px-gutter rounded-DEFAULT transition-colors duration-200">
                Return to Review
            </button>
</div>
</main>
<script>
        // Minimal interaction logic
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', function() {
                this.style.transform = 'scale(0.98)';
            });
            button.addEventListener('mouseup', function() {
                this.style.transform = 'scale(1)';
            });
            button.addEventListener('mouseleave', function() {
                this.style.transform = 'scale(1)';
            });
        });
    </script>
</body></html>
